<footer>
  <span>
    {% comment %}
    &copy; <time datetime="{{ site.time }}">{{ site.time | date: '%Y' }}</time> {{ site.author.name }}. Made with Jekyll using the <a href="https://github.com/chesterhow/tale/">Tale</a> theme.
    {% endcomment %}
  </span>
</footer>

<!-- 1. Load Mermaid.js Library -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

<!-- 2. Parse and render markdown code blocks as Mermaid diagrams -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    mermaid.initialize({ startOnLoad: true, theme: 'default' });
    
    const mermaidBlocks = document.querySelectorAll("code.language-mermaid");
    
    mermaidBlocks.forEach(function(block) {
      const preElement = block.parentNode;
      const newDiv = document.createElement("div");
      
      newDiv.className = "mermaid";
      newDiv.textContent = block.textContent;
      
      if (preElement.tagName === "PRE") {
        preElement.parentNode.replaceChild(newDiv, preElement);
      } else {
        block.parentNode.replaceChild(newDiv, block);
      }
    });
  });
</script>

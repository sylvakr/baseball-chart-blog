<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {% seo %}

  <!-- CSS -->
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Libre+Baskerville:400,400i,700">
  <!-- 머리(로고 차트만들기 › 블로그)의 글꼴 — 구운 화면과 같은 Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ "/assets/favicon.svg" | relative_url }}">

  <!-- RSS -->
  {% feed_meta %}

  <!-- Google Analytics-->
  {% if site.google_analytics and jekyll.environment == 'production' %}
  {% include analytics.html %}
  {% endif %}

  <!-- beehiiv Attribution tracking & preconnect -->
  <link rel="preconnect" href="https://subscribe-forms.beehiiv.com" crossorigin>
  <link rel="dns-prefetch" href="https://subscribe-forms.beehiiv.com">
  <script type="text/javascript" async src="https://subscribe-forms.beehiiv.com/attribution.js"></script>
</head>

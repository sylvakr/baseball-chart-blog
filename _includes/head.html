<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {% seo %}

  <!-- CSS -->
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Libre+Baskerville:400,400i,700">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ "/assets/logo.svg" | relative_url }}">

  <!-- RSS -->
  {% feed_meta %}

  <!-- Google Analytics-->
  {% if site.google_analytics and jekyll.environment == 'production' %}
  {% include analytics.html %}
  {% endif %}

  <!-- beehiiv Attribution tracking & preconnect -->
  <link rel="preconnect" href="https://subscribe-forms.beehiiv.com" crossorigin>
  <link rel="dns-prefetch" href="https://subscribe-forms.beehiiv.com">
  <script type="text/javascript" async src="https://subscribe-forms.beehiiv.com/attribution.js"></script>
</head>

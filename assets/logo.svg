<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- 화면 안 로고(앱 왼쪽 위 · 구운 화면 셋). 선과 색은 favicon.svg 와 같고 **둘레 여백만 원래대로**
       둔다 — 여백을 자르면 같은 칸에서 1.4배로 커 보인다(2026-10-07). 탭·검색용은 favicon.svg. -->
  <rect width="100" height="100" fill="none"/>

  <!-- 정방향 야구 홈플레이트 (아래쪽이 뾰족한 ▼ 모양) -->
  <path d="M 25,30 L 75,30 L 75,60 L 50,80 L 25,60 Z" fill="none" stroke="#7a7a7a" stroke-width="5" stroke-linejoin="round"/>

  <!-- 똑바로 올라가는 우상향 데이터 라인 (꺾은선 그래프) -->
  <path d="M 20,68 L 40,55 L 55,60 L 80,28" fill="none" stroke="#444444" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
